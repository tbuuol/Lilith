# Kopiere diese Datei nach Lilith.conf und trage echte RPC-Zugangsdaten ein.
# Lilith.conf muss nur für deinen Benutzer lesbar sein: chmod 600 Lilith.conf

[server]
port = 9999
ui_port = 10000
# Nur exakt angegebene Browser-Ursprünge dürfen Requests senden.
allowed_origins = http://127.0.0.1:10000,http://localhost:10000

[node:Bitcoin]
host = 127.0.0.1
port = 8332
user = CHANGE_ME
password = CHANGE_ME

[node:Kotia]
host = 127.0.0.1
port = 10001
user = user
password = pass
